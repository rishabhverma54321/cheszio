name: Build & Push to Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [main]        # run on every push to main

jobs:
  build-client:
    runs-on: self-hosted  # GitHub's hosted runner (a fresh Linux VM)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client                    # build from the client/ folder
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cheszio-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cheszio-client:${{ github.sha }}

  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cheszio-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cheszio-server:${{ github.sha }}
